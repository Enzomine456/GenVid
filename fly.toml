# fly.toml app configuration file generated for genvid on 2025-10-17T21:20:55-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "genvid"
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "echo 'Deploying GenVid application'"

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
